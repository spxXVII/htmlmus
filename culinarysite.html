<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кулинарный сайт</title>
<style>
:root{--bg:#f6f1ea;--surface:#fffdf9;--ink:#2a1f1a;--muted:#6f625a;--accent:#b3261e;--line:#e5dacd;--hero1:#5a2a22;--hero2:#8c3b2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1512;--surface:#261d19;--ink:#f3e9df;--muted:#b9a99c;--accent:#ff7b6b;--line:#3a2e28;--hero1:#2d1512;--hero2:#5a2a22}}
:root[data-theme="dark"]{--bg:#1b1512;--surface:#261d19;--ink:#f3e9df;--muted:#b9a99c;--accent:#ff7b6b;--line:#3a2e28;--hero1:#2d1512;--hero2:#5a2a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
header{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;padding:22px 20px;text-align:center}
.logo{font-size:1.8rem;font-weight:700;color:#fff;text-decoration:none;letter-spacing:.02em}
nav ul{list-style:none;display:flex;gap:22px;justify-content:center;padding:0;margin:12px 0}
nav a{color:#ffe9d6;text-decoration:none;font-family:system-ui,sans-serif;font-size:.95rem;padding:4px 2px;border-bottom:2px solid transparent}
nav a:hover,nav a.on{border-color:#ffe9d6}
.search{display:flex;gap:8px;justify-content:center;font-family:system-ui,sans-serif}
.search input{width:min(260px,60vw);padding:8px 10px;border:1px solid #fff4;border-radius:4px;font-size:.95rem}
button{font:inherit;cursor:pointer}
.search button{padding:8px 16px;border:0;border-radius:4px;background:#fff;color:#2a1f1a;font-family:system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 16px 90px}
h1{font-size:1.6rem;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;text-align:center;border-radius:4px}
.pic{height:170px;display:grid;place-items:center;font-size:5rem;border-radius:4px;margin-bottom:12px}
.card h2{margin:6px 0;font-size:1.25rem}
.card p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.more{background:none;border:0;color:var(--accent);font-size:.95rem;text-decoration:underline;font-family:system-ui,sans-serif}
.view{display:none}.view.on{display:block}
.empty{color:var(--muted);padding:20px 0}
.tips{display:grid;gap:14px;max-width:640px}
.tip{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-left:4px solid var(--accent);border-radius:4px}
.tip b{display:block;margin-bottom:2px}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:420px;width:90%;padding:22px}
dialog::backdrop{background:#0008}
.close{float:right;background:none;border:0;font-size:1.5rem;color:var(--ink)}
.player{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:8px 14px;font-family:system-ui,sans-serif;font-size:.9rem;box-shadow:0 4px 18px #0003}
.player button{border:0;border-radius:20px;background:var(--accent);color:#fff;padding:7px 14px}
.player input{width:80px}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-family:system-ui,sans-serif;font-size:.9rem;box-shadow:0 4px 18px #0003;z-index:5}
.hint[hidden]{display:none}
</style>
</head>
<body>
<div class="hint" id="hint">Нажмите в любом месте, чтобы включить фоновую музыку</div>
<header>
  <a class="logo" href="#recipes">Кулинарный сайт</a>
  <nav><ul>
    <li><a href="#recipes" data-v="recipes">Рецепты</a></li>
    <li><a href="#ingredients" data-v="ingredients">Ингредиенты</a></li>
    <li><a href="#tips" data-v="tips">Кулинарные советы</a></li>
  </ul></nav>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Поиск…" aria-label="Поиск рецептов">
    <button id="searchBtn">Найти</button>
  </div>
</header>
<main>
  <section class="view" id="recipes">
    <h1>Рецепты</h1>
    <div class="grid" id="recipeGrid"></div>
    <p class="empty" id="empty" hidden>Ничего не найдено. Попробуйте другое название.</p>
  </section>
  <section class="view" id="ingredients">
    <h1>Ингредиенты</h1>
    <div class="grid" id="ingGrid"></div>
  </section>
  <section class="view" id="tips">
    <h1>Кулинарные советы</h1>
    <div class="tips" id="tipList"></div>
  </section>
</main>
<dialog id="dlg"><button class="close" id="dlgClose" aria-label="Закрыть">×</button><h2 id="dT"></h2><div class="pic" id="dP"></div><p id="dD"></p></dialog>
<div class="player">
  <button id="musicBtn">Включить музыку</button>
  <input type="range" id="vol" min="0" max="100" value="40" aria-label="Громкость">
</div>
<script>
var recipes=[
{n:"Борщ",e:"🍲",c:"#c0392b",s:"Очень вкусный и сытный борщ.",d:"Борщ — разновидность супа на основе свёклы, которая придаёт ему яркий красный цвет. Подаётся со сметаной и зеленью."},
{n:"Пицца",e:"🍕",c:"#e08a2e",s:"Тонкое тесто, сыр и томатный соус.",d:"Классическая пицца с томатным соусом, моцареллой и базиликом. Выпекается при высокой температуре около 10 минут."},
{n:"Паста",e:"🍝",c:"#d9a441",s:"Спагетти с густым соусом болоньезе.",d:"Паста варится до состояния аль денте и смешивается с мясным соусом, томатами и пармезаном."},
{n:"Греческий салат",e:"🥗",c:"#5c8a3a",s:"Свежие овощи, фета и оливки.",d:"Помидоры, огурцы, сладкий перец, красный лук, фета и оливки, заправленные оливковым маслом."}
];
var ings=[
{n:"Свёкла",e:"🟣",c:"#8e3b6b",s:"Основа борща и винегрета.",d:"Выбирайте небольшие плотные корнеплоды: они слаще и быстрее варятся."},
{n:"Томаты",e:"🍅",c:"#d6402f",s:"Для соусов и салатов.",d:"Для соусов подойдут мясистые сорта, для салатов — сочные."},
{n:"Базилик",e:"🌿",c:"#4f8a3d",s:"Свежая зелень для пиццы и пасты.",d:"Добавляйте в конце приготовления, чтобы сохранить аромат."},
{n:"Сыр",e:"🧀",c:"#e6b340",s:"Моцарелла, пармезан, фета.",d:"Твёрдые сыры натирайте перед подачей, мягкие добавляйте в конце."}
];
var tips=[
["Соль в конце","Солите суп ближе к концу варки: так легче не пересолить."],
["Тесто должно отдохнуть","Дайте тесту полежать 30 минут: оно станет эластичнее."],
["Острый нож","Острый нож безопаснее тупого и аккуратнее режет овощи."],
["Вода для пасты","Оставьте стакан воды после варки пасты: с ней соус станет гуще."]
];
function card(r,i,k){return '<article class="card"><div class="pic" style="background:'+r.c+'33">'+r.e+'</div><h2>'+r.n+'</h2><p>'+r.s+'</p><button class="more" data-k="'+k+'" data-i="'+i+'">Подробнее</button></article>'}
function render(list){
  var g=document.getElementById('recipeGrid');
  g.innerHTML=list.map(function(r){return card(r,recipes.indexOf(r),'r')}).join('');
  document.getElementById('empty').hidden=list.length>0;
}
render(recipes);
document.getElementById('ingGrid').innerHTML=ings.map(function(r,i){return card(r,i,'i')}).join('');
document.getElementById('tipList').innerHTML=tips.map(function(t){return '<div class="tip"><b>'+t[0]+'</b>'+t[1]+'</div>'}).join('');
function searchRecipes(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  render(recipes.filter(function(r){return r.n.toLowerCase().indexOf(q)>-1||r.s.toLowerCase().indexOf(q)>-1}));
  location.hash='recipes';route();
}
document.getElementById('searchBtn').onclick=searchRecipes;
document.getElementById('searchInput').onkeydown=function(e){if(e.key==='Enter')searchRecipes()};
var dlg=document.getElementById('dlg');
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.more');if(!b)return;
  var o=(b.dataset.k==='r'?recipes:ings)[b.dataset.i];
  document.getElementById('dT').textContent=o.n;
  var p=document.getElementById('dP');p.textContent=o.e;p.style.background=o.c+'33';
  document.getElementById('dD').textContent=o.d;
  dlg.showModal();
});
document.getElementById('dlgClose').onclick=function(){dlg.close()};
function route(){
  var h=(location.hash||'#recipes').slice(1);
  if(!document.getElementById(h)||!document.getElementById(h).classList.contains('view'))h='recipes';
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===h)});
  document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.dataset.v===h)});
}
window.addEventListener('hashchange',route);route();

/* Фоновая музыка: мелодия генерируется прямо в браузере (Web Audio) */
var ctx,master,timer,step=0,nextT=0,playing=false,userOff=false;
var chords=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]];
var arp=[0,1,2,1,2,1,2,1];
var btn=document.getElementById('musicBtn'),vol=document.getElementById('vol'),hint=document.getElementById('hint');
function tone(f,t,d,v,type){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);
}
function sched(){
  while(nextT<ctx.currentTime+0.4){
    var i=step%32,ch=chords[Math.floor(i/8)],k=i%8;
    if(k===0)ch.forEach(function(f){tone(f/2,nextT,4,0.05,'triangle')});
    tone(ch[arp[k]]*2,nextT,0.9,0.07,'sine');
    step++;nextT+=0.5;
  }
}
function startMusic(){
  try{
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext;
      ctx=new AC();master=ctx.createGain();master.gain.value=vol.value/100;master.connect(ctx.destination);
    }
    ctx.resume().then(function(){
      if(playing)return;
      playing=true;nextT=ctx.currentTime+0.1;sched();timer=setInterval(sched,100);
      btn.textContent='Выключить музыку';hint.hidden=true;
    });
  }catch(e){}
}
function stopMusic(){
  playing=false;clearInterval(timer);
  if(ctx)ctx.suspend();
  btn.textContent='Включить музыку';
}
btn.onclick=function(e){e.stopPropagation();if(playing){userOff=true;stopMusic()}else{userOff=false;startMusic()}};
vol.oninput=function(){if(master)master.gain.value=vol.value/100};
vol.onclick=function(e){e.stopPropagation()};
/* Браузеры блокируют автозапуск, поэтому стартуем с первого действия на странице */
function first(){if(!userOff&&!playing)startMusic();}
['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,first,{once:true})});
</script>
</body>
</html>
